<div appPageRoot style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- En-tête partagé -->
  <app-header></app-header>

  <!-- Actions (boutons de navigation) -->
  <section id="actions" class="actions-section" [style.display]="'grid'" [style.gridTemplateColumns]="'repeat(auto-fit, minmax(180px, 1fr))'" [style.gap]="'1rem'" [style.padding]="'2.5rem 1rem'">
    <!-- Actions (boutons de navigation) -->
    <a [routerLink]="['competences']" class="btn competences-btn competences-btn-custom" [style.background]="'linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%)'" [style.color]="'white'" [style.padding]="'0.75rem 1.5rem'" [style.borderRadius]="'12px'" [style.textDecoration]="'none'" [style.fontWeight]="'600'" [style.transition]="'all 0.3s ease'" [style.textAlign]="'center'">
      <span style="color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">💪 Mes compétences</span>
    </a>

    <a [routerLink]="['projets']" class="btn projects-btn projects-btn-custom" [style.background]="'linear-gradient(135deg, #667eea 0%, #445ba7 100%)'" [style.color]="'white'" [style.padding]="'0.75rem 1.5rem'" [style.borderRadius]="'12px'" [style.textDecoration]="'none'" [style.fontWeight]="'600'" [style.transition]="'all 0.3s ease'" [style.textAlign]="'center'">
      <span style="color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">📁 Mes projets</span>
    </a>

    <a [routerLink]="['experiences']" class="btn experiences-btn experiences-btn-custom" [style.background]="'linear-gradient(135deg, #ee7196 0%, #c44354 100%)'" [style.color]="'white'" [style.padding]="'0.75rem 1.5rem'" [style.borderRadius]="'12px'" [style.textDecoration]="'none'" [style.fontWeight]="'600'" [style.transition]="'all 0.3s ease'" [style.textAlign]="'center'">
      <span style="color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">💼 Mes expériences</span>
    </a>

    <a [routerLink]="['formations']" class="btn formations-btn formations-btn-custom" [style.background]="'linear-gradient(135deg, #65ecf8 0%, #40a8c5 100%)'" [style.color]="'white'" [style.padding]="'0.75rem 1.5rem'" [style.borderRadius]="'12px'" [style.textDecoration]="'none'" [style.fontWeight]="'600'" [style.transition]="'all 0.3s ease'" [style.textAlign]="'center'">
      <span style="color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">🎓 Mes formations</span>
    </a>

    <a [routerLink]="['contact']" class="btn contact-btn contact-btn-custom" [style.background]="'linear-gradient(135deg, #66ea87 0%, #4ba272 100%)'" [style.color]="'white'" [style.padding]="'0.75rem 1.5rem'" [style.borderRadius]="'12px'" [style.textDecoration]="'none'" [style.fontWeight]="'600'" [style.transition]="'all 0.3s ease'" [style.textAlign]="'center'">
      <span style="color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">📧 Me contacter</span>
    </a>
  </section>

  <!-- Section réseaux sociaux -->
  <section id="reseau-social" class="social-section" style="text-align: center; padding: 2.5rem;">
    <h3 style="color: var(--text-primary); margin-bottom: 1rem;">Suivez-moi sur les réseaux</h3>
    <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
      <a href="https://github.com/Stephous" target="_blank" rel="noopener noreferrer"
         class="social-link github" style="padding: 0.875rem 1.3rem; background: var(--bg-primary); color: #24292e; border-radius: 9999px; text-decoration: none; border: 2px solid #e1e4e8; font-weight: 600; transition: all 0.3s ease;">
        <svg style="width: 18px; height: 18px; fill: currentColor; vertical-align: middle; margin-right: 0.5rem;" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.509 5.924.43.312.833 1.123.833 2.246v3.095c0 .319.193.694.802.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
        GitHub
      </a>
      <a href="https://linkedin.com/in/stephane-dacheux-851957176" target="_blank" rel="noopener noreferrer"
         class="social-link linkedin" style="padding: 0.875rem 1.3rem; background: var(--bg-primary); color: #0077b5; border-radius: 9999px; text-decoration: none; border: 2px solid #0077b5; font-weight: 600; transition: all 0.3s ease;">
        <svg style="width: 18px; height: 18px; fill: currentColor; vertical-align: middle; margin-right: 0.5rem;" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 12H5v-2h5v2zm3-4H5v-2h8v2zm-3-6H5V7h5v2z"/></svg>
        LinkedIn
      </a>
    </div>
  </section>

  <!-- Footer poussé en bas grâce à flexbox -->
  <footer style="flex-shrink: 0; position: fixed; left: 0; right: 0; bottom: 0; background: #1e293b; color: white; padding: 3rem 2rem; text-align: center;">
    <app-footer></app-footer>
  </footer>

</div>
