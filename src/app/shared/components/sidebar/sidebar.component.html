<nav class="sidebar" [class.hidden]="!isVisible">
  <!-- Bouton hamburger (visible uniquement sur mobile) -->
  <div class="mobile-toggle" *ngIf="isMobile">
    <button class="hamburger-btn" (click)="toggleSidebar()">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <label class="sidebar-checkbox" [class.checked]="isVisible">
      Menu
    </label>
  </div>

  <!-- Contenu du menu -->
  <div class="sidebar-content">
    <div class="sidebar-header">
      <h3>Menu</h3>
      <p class="subtitle">Navigation rapide</p>
    </div>

    <!-- Liste de navigation -->
    <ul class="nav-links">
      <!-- Accueil -->
      <li>
        <a [routerLink]="'/accueil'" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span class="nav-text">Accueil</span>
        </a>
      </li>

      <!-- Projets -->
      <li [class.hidden-mobile]="isMobile && !isVisible">
        <a [routerLink]="'/projets'" routerLinkActive="active-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          <span class="nav-text">Mes projets</span>
        </a>
      </li>

      <!-- Expériences -->
      <li [class.hidden-mobile]="isMobile && !isVisible">
        <a [routerLink]="'/experiences'" routerLinkActive="active-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
          <span class="nav-text">Mes expériences</span>
        </a>
      </li>

      <!-- Formations -->
      <li [class.hidden-mobile]="isMobile && !isVisible">
        <a [routerLink]="'/formations'" routerLinkActive="active-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          <span class="nav-text">Mes formations</span>
        </a>
      </li>

      <!-- Compétences -->
      <li [class.hidden-mobile]="isMobile && !isVisible">
        <a [routerLink]="'/competences'" routerLinkActive="active-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.7-3.7a1 1 0 0 0 0-1.4l-1.6-1.6a1 1 0 0 0-1.4 0zm-5.2 0a1 1 0 0 0 0 1.4L7.9 9.3a1 1 0 0 0 0 1.4l-3.7 3.7a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.7-3.7a1 1 0 0 0 0-1.4L9.5 7.7z"/>
          </svg>
          <span class="nav-text">Mes compétences</span>
        </a>
      </li>

      <!-- Contact -->
      <li [class.hidden-mobile]="isMobile && !isVisible">
        <a [routerLink]="'/contact'" routerLinkActive="active-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <span class="nav-text">Contact</span>
        </a>
      </li>
    </ul>

    <!-- Footer du menu -->
    <div class="sidebar-footer">
      <p class="copyright">&copy; 2026 Stéphane Dacheux</p>
    </div>
  </div>
</nav>
